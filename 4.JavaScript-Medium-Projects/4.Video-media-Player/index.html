<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video-Player</title>
    
    
    <!-- Gilroy-CDN -->
     <!-- Include via CDN (free / available weights) -->
<link href="https://cdn.jsdelivr.net/gh/repalash/gilroy-free-webfont@fonts/Gilroy-Light.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/repalash/gilroy-free-webfont@fonts/Gilroy-Extrabold.css" rel="stylesheet">
<!-- alternatively, using another CDN (if available) -->
<link href="https://fonts.cdnfonts.com/css/gilroy-bold" rel="stylesheet">


    <!-- Remix-Icon-Cdn-Link -->
     <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>


    <!-- User-Defined Style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
     <nav>
        <div id="logo">
            <h1>VPlayer</h1>
            <video src="assets/videos/video-player-logo.mp4" autoplay loop muted></video>
        </div>
        <div id="input-bar">
            <input class="search-bar" type="text" placeholder="Search Video">
            <div id="search-data">
                
                
            </div>
        </div>
       
         <div id="actions">
            <a href="#">Home</a>
            <a href="#">Subscriptions</a>
            <a href="#">MyVideo</a>
        
            <div class="favourite-cart-container">
                <i class="favorite-Cart ri-user-heart-fill"></i>
                <div id="fav-section">
                  
                   
                </div>
            </div>
            <img src="assets/images/profile-photo.jpg" alt="profile-photo">
 
         </div>
 
        </nav>


        <div id="content">
            <div id="video-section">
                <div id="video">
                 <video src=""  ></video>

                 <div id="video-actions">
                    
                     <i class="backward ri-skip-back-fill"></i>
                     <i class="play ri-play-large-fill"></i>
                     <i class="forward ri-skip-forward-fill"></i>
                 </div>
                  
                </div>

                <div id="video-text">
                    
                </div>
                
            </div>





            <div id="suggestions">
              
           
            </div>
        </div>

        <footer>
            <h1>Made By Ashutosh </h1>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
